syntax = "proto3";

package raft;

import "kvstore.proto";

// Raft RPC service
service Raft {
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}

// Raft RPC for leader to replicate log entries
message AppendEntriesRequest {
  int32 term = 1;                    // Leader's current term
  int32 leader_id = 2;               // So follower can redirect clients
  int32 prev_log_index = 3;          // Index of log entry immediately preceding new ones
  int32 prev_log_term = 4;           // Term of prevLogIndex entry
  repeated LogEntry entries = 5;     // Log entries to store (empty for heartbeat)
  int32 leader_commit = 6;           // Leader's commitIndex
}

message AppendEntriesResponse {
  int32 term = 1;                    // currentTerm, for leader to update itself
  bool success = 2;                  // True if follower contained entry matching prevLogIndex and prevLogTerm
  int32 match_index = 3;             // Index of highest log entry known to be replicated on this server
}

// Raft RPC for candidate to request votes
message RequestVoteRequest {
  int32 term = 1;                    // Candidate's current term
  int32 candidate_id = 2;            // ID of candidate requesting vote
  int32 last_log_index = 3;          // Index of candidate's last log entry
  int32 last_log_term = 4;           // Term of candidate's last log entry
}

message RequestVoteResponse {
  int32 term = 1;                    // currentTerm, for candidate to update itself
  bool vote_granted = 2;             // True means candidate received vote
}

// A single Raft log entry wrapping a KeyValuePair command
message LogEntry {
  int32 term = 1;                    // Term when entry was received by leader
  kvstore.KeyValuePair command = 2;  // The KV operation (Put, Delete, Swap)
}
